name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Required permissions for native GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Publish App
      run: dotnet publish -c Release -o release --nologo

    - name: Update Base Href for GitHub Pages
      run: sed -i 's/<base href="\/" \/>/<base href="\/hci-EasyAmbiDiceyRoll-project\/" \/>/g' release/wwwroot/index.html

    - name: Bypass Jekyll processing
      run: touch release/wwwroot/.nojekyll

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4